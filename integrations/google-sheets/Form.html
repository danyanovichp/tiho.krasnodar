<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:8px;color:#4b342d;background:#f6efe3;font:17px/1.55 Arial,sans-serif}form{padding:24px;border:1px solid #cdbfae;border-radius:8px}h3{font:26px Georgia,serif;letter-spacing:0;margin:0 0 24px;border-bottom:1px dashed #c7b7a2;padding-bottom:16px}fieldset{padding:0;margin:0 0 22px;border:0}legend{margin-bottom:12px;font-size:16px}.days{display:flex;gap:10px}.days label{flex:1;cursor:pointer}.days input{position:absolute;opacity:0}.days span{display:block;text-align:center;border:1px solid #cdbfae;border-radius:6px;padding:12px 8px}.days input:checked+span{background:#596a58;color:white}.days input:focus-visible+span{outline:3px solid #304a9c;outline-offset:3px}.quantity{display:flex}.quantity button{width:48px;height:48px;border-radius:4px;background:#dfbeb0;border:1px solid #cdbfae;font-size:24px;cursor:pointer}.quantity input{font:21px Arial,sans-serif;width:90px;text-align:center;border:1px solid #4b342d;border-inline:0;background:transparent;color:inherit;appearance:textfield}.quantity input::-webkit-inner-spin-button{appearance:none}.total{display:flex;justify-content:space-between;align-items:center;border-block:1px dashed #c7b7a2;padding:16px 0;margin:22px 0}.total strong{font:32px Georgia,serif;color:#4b342d}.submit{width:100%;min-height:52px;background:#596a58;color:white;border:0;border-radius:6px;font:16px 'Courier New',monospace;cursor:pointer;padding:15px 10px}button:disabled{opacity:.5;cursor:default}.note{font-size:14px;line-height:1.6}#status{font-size:16px}#status.error{color:#9c2828}#status.success{color:#345735}.trap{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}a{color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #304a9c;outline-offset:3px}@media(max-width:400px){body{padding:4px}form{padding:18px}}
.contact-note{font-size:14px;margin:14px 0 0}.change-note{margin-top:0}#status:empty{display:none}h3{color:#4b342d}.quantity input{border-color:#cdbfae}button,a,input{touch-action:manipulation}</style></head><body><form id="plan-form"><h3>Когда заглянете?</h3><fieldset><legend>Когда планируете зайти?</legend><div class="days"><label><input type="radio" name="day" id="today" required checked><span>Сегодня</span></label><label><input type="radio" name="day" id="tomorrow" required><span>Завтра</span></label></div></fieldset><fieldset><legend>Сколько коробочек?</legend><div class="quantity"><button type="button" id="minus" aria-label="Уменьшить количество">−</button><input id="quantity" type="number" min="1" max="20" value="1" required aria-label="Количество коробок"><button type="button" id="plus" aria-label="Увеличить количество">+</button></div></fieldset><div class="total"><span>300 ₽ за коробочку</span><strong id="total" aria-live="polite">300 ₽</strong></div><label class="trap" aria-hidden="true">Не заполнять<input name="website" tabindex="-1" autocomplete="off"></label><button id="submit" class="submit" type="submit" disabled>Подключаем форму…</button><p class="note">Без оплаты и номера телефона. Это не бронь — наличие уточняйте на месте.</p><p class="note change-note">Если планы изменились, их можно отправить заново с того же устройства.</p><p id="status" role="status" aria-live="polite"></p><p class="contact-note"><a href="https://t.me/danyanovich" target="_blank" rel="noopener">Написать нам в Telegram ↗</a></p><noscript>Для записи заявки включите JavaScript.</noscript></form><script>
'use strict';
const form=document.querySelector('#plan-form'),quantity=document.querySelector('#quantity'),send=document.querySelector('#submit'),status=document.querySelector('#status');
let ready=false,busy=false,days=[],volatileIds={};
function day(){return document.querySelector('[name=day]:checked').value;}
function idFor(date){const key='tiho-plan:'+date;try{let id=localStorage.getItem(key);if(!id){id=crypto.randomUUID();localStorage.setItem(key,id);}return id;}catch{return volatileIds[date]||(volatileIds[date]=crypto.randomUUID());}}
function update(){quantity.value=Math.max(1,Math.min(20,Math.trunc(Number(quantity.value)||1)));document.querySelector('#total').textContent=new Intl.NumberFormat('ru-RU').format(Number(quantity.value)*300)+' ₽';document.querySelector('#minus').disabled=busy||Number(quantity.value)===1;document.querySelector('#plus').disabled=busy||Number(quantity.value)===20;}
function message(text,error){status.textContent=text;status.className=error?'error':'success';}
function controls(disabled){busy=disabled;send.disabled=disabled||!ready;form.querySelectorAll('input').forEach(input=>input.disabled=disabled);update();}
document.querySelector('#minus').onclick=()=>{quantity.value=Number(quantity.value)-1;update();};document.querySelector('#plus').onclick=()=>{quantity.value=Number(quantity.value)+1;update();};quantity.addEventListener('change',update);
form.addEventListener('submit',event=>{event.preventDefault();if(!ready||busy||!form.reportValidity())return;update();const payload={id:idFor(day()),day:day(),quantity:Number(quantity.value),website:form.elements.website.value};controls(true);message('Записываем ваши планы…',false);let finished=false;const timer=setTimeout(()=>{if(!finished){finished=true;controls(false);message('Ответ задержался. Можно повторить — эта заявка не продублируется.',true);}},25000);
 google.script.run.withSuccessHandler(result=>{if(finished)return;finished=true;clearTimeout(timer);controls(false);if(!result||result.saved!==true){message('Не получилось записать ваши планы. Попробуйте ещё раз или напишите нам в Telegram.',true);return;}send.textContent='Обновить мои планы';message('Спасибо! Будем рады вас видеть. Постараемся, чтобы пахлавы хватило всем.',false);}).withFailureHandler(()=>{if(finished)return;finished=true;clearTimeout(timer);controls(false);message('Не получилось записать ваши планы. Попробуйте ещё раз или напишите нам в Telegram.',true);}).submitPlan(payload);
});
update();
if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(result=>{if(!Array.isArray(result)||result.length!==2)return;days=result;document.querySelector('#today').value=days[0];document.querySelector('#tomorrow').value=days[1];ready=true;send.disabled=false;send.textContent='Планирую зайти →';}).withFailureHandler(()=>{send.textContent='Форма временно недоступна';message('Не удалось подключить запись. Попробуйте обновить страницу позже.',true);}).getPlanDays();}else{send.textContent='Приём ещё не подключён';message('Форма подготовлена. Запись заработает после подключения Google Таблицы.',true);}
</script></body></html>
